name: Feature Request
description: Suggest an idea, enhancement, or new feature for Lumen.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature for Lumen! Please describe your use case and proposed design.
  - type: textarea
    id: problem
    attributes:
      label: Problem Description
      description: A clear and concise description of what the problem or limitation is. What use case does this solve?
      placeholder: I am always frustrated when... / Lumen currently lacks support for...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen and how it should work. Include proposed interfaces, APIs, or usage examples if applicable.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions, patterns, or workarounds you have considered and why they were not chosen.
  - type: checkboxes
    id: packages
    attributes:
      label: Affected Packages
      description: Which packages within the Lumen monorepo does this feature affect?
      options:
        - label: `@lumen/core`
        - label: `@lumen/server`
        - label: `@lumen/web-sdk`
        - label: `@lumen/react`
        - label: `@lumen/cli`
        - label: Other / Infrastructure
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, code snippets, or screenshots here.
